# synth_v1 judge calibration — planted-flaw cases (SY-B). Same approach as sft_v2 CALIBRATION.md:
# run the real judge over documents whose defects we know, check it lands in the expected band.
# Case 01 reproduces the SY-A pilot escape: a real anatomy label slip (Teres major glossed as «ترس مینور»)
# was scored 8 by the judge — we want subtle-but-real factual label errors capped at 6.
# expect: overall_max / overall_min bound the judge's overall score; criterion bounds optional.
cases:
  - id: med_label_slip
    domain: medicine_science
    subdomain: anatomy
    doc_type: explainer_article
    topic: walls of the axilla
    flaw: "subtle label slip: Teres major glossed as «ترس مینور» (from pilot doc that escaped with 8)"
    expect: {overall_max: 6, correctness_max: 6}
    text: |
      # دیواره‌های ناحیهٔ زیربغل
      ناحیهٔ زیربغل (Axilla) فضایی هرمی‌شکل میان قفسهٔ سینه و بازوست که مسیر عبور عناصر عصبی-عروقی اندام فوقانی است. دیوارهٔ قدامی آن را ماهیچه‌های پکتورال بزرگ و کوچک (Pectoralis major and minor) می‌سازند. دیوارهٔ خلفی توسط ماهیچه‌های ساب‌اسکاپولاریس (Subscapularis)، ترس مینور (Teres major) و لاتیسیموس دورسی (Latissimus dorsi) محدود می‌شود. دیوارهٔ داخلی را دنده‌های اول تا چهارم و ماهیچهٔ سراتوس قدامی تشکیل می‌دهند و دیوارهٔ خارجی، ناودان بین‌برجستگی استخوان بازوست. شناخت این مرزها برای فهم مسیر شریان زیربغلی و طناب‌های شبکهٔ بازویی ضروری است.
  - id: math_wrong_final
    domain: reasoning_cot
    subdomain: math_problem_solving
    doc_type: worked_problems
    topic: percent problems
    flaw: "wrong final answer stated confidently (15% of 240 = 38)"
    expect: {overall_max: 2}
    text: |
      # محاسبهٔ درصد
      ### مسئله
      15 درصد عدد 240 را به دست آورید.
      **گام 1:** درصد را به کسر تبدیل می‌کنیم: $15\% = \frac{15}{100} = 0.15$.
      **گام 2:** ضرب می‌کنیم: $0.15 \times 240 = 38$.
      جواب: 38
