      # شهود و استدلال
      در حل مسئله، دو مسیر مکمل داریم: شهود شهودی که پاسخ را بی‌واسطه و به‌صورت شهودی پیش می‌نهد، و استدلال استنتاجی که با استنتاج گام‌به‌گام به نتیجه می‌رسد. تجربهٔ تجربی نشان می‌دهد که متخصصان ابتدا از شهود بهره می‌گیرند و سپس درستی آن را با استدلال می‌آزمایند. به بیان دیگر، شهود پیشنهاد می‌دهد و استدلال بررسی می‌کند؛ یعنی شهود نقش پیشنهاددهنده دارد و استدلال نقش بررسی‌کننده. این تقسیم کار، همان تقسیم کاری است که در آن هر مسیر کار خود را انجام می‌دهد.
