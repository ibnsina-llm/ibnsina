    doc_type: explainer_article
    topic: binary search
    flaw: "an English sentence dropped mid-paragraph"
    expect: {overall_max: 3}
    text: |
      # جست‌وجوی دودویی
      جست‌وجوی دودویی (Binary search) روشی برای یافتن عنصر در آرایهٔ مرتب است. در هر گام، عنصر میانی بررسی می‌شود و نیمی از آرایه کنار گذاشته می‌شود. The algorithm keeps halving the search interval until the target is found. به همین دلیل پیچیدگی زمانی آن $O(\log n)$ است و برای آرایه‌های بزرگ بسیار کاراست.
